name: McGrath
kind: company
description: >-
  McGrath is one of Australia's largest residential real estate brokerage
  networks, founded in Sydney in 1988 by John McGrath and operating a mixed
  company-owned and franchise network of roughly 118 offices across New South
  Wales, Queensland, the ACT, Victoria and Tasmania. Its business lines span
  residential sales, property management and rentals, projects and new-development
  marketing, rural and livestock, an Asia Desk for offshore buyers, and mortgage
  broking through Oxygen Home Loans. Listed on the ASX in 2015 as McGrath Limited
  (ASX:MEA), it was acquired in June 2024 by a consortium of Knight Frank Australia
  and New Zealand's Bayleys for A$95.5m and delisted from the ASX on 28 June 2024.
  McGrath sits on the demand side of the Australian property value chain: it is a
  brokerage that publishes listings into the REA Group (realestate.com.au) and
  Domain portal duopoly, settles transactions over the PEXA electronic conveyancing
  network, and consumes valuation data from PropTrack and CoreLogic rather than
  producing any of those rails itself. Its API posture is honestly nil. No
  developer portal exists — developer., developers., api., docs., feeds., data. and
  portal. subdomains of mcgrath.com.au all fail to resolve (NXDOMAIN), and
  /developers, /api, /docs, /api-docs, /openapi.json, /swagger.json, /$metadata and
  /.well-known/openid-configuration all return HTTP 404. RESO — the only genuinely
  mandated machine-readable real estate contract anywhere in this study — is a North
  American standard driven by NAR and MLS membership; it has no Australian
  counterpart and McGrath has no RESO Web API or Data Dictionary certification, no
  OData surface, and no Universal Property Identifier usage. The only
  interoperability standards McGrath demonstrably implements are robots.txt and
  twelve XML sitemaps; every /.well-known/ document probed — security.txt,
  openid-configuration, oauth-authorization-server, api-catalog, ai-plugin.json —
  and /llms.txt return 404. Its robots.txt enumerates twenty crawler groups
  including GPTBot, ChatGPT-User, OAI-SearchBot, ClaudeBot, PerplexityBot,
  Google-Extended, CCBot and Bytespider, but under RFC 9309 group-matching rules
  those named AI agents are disallowed only from Google Maps JS/RPC paths — the
  /properties/ and /search/ disallow lands solely on User-agent: *, so the listing
  corpus is nominally open to the named AI crawlers and closed to generic ones,
  while the properties-buy/sold/rent/leased sitemaps advertise those same URLs.
  Reachability is the harder gate: www.mcgrath.com.au sits behind a Vercel Security
  Checkpoint that answers scripted clients with HTTP 429 and a browser challenge on
  every path, so no unattended agent can read the site regardless of robots.txt.
  The listing inventory is a marketing asset routed to portals under commercial
  agreements, not a developer surface.
