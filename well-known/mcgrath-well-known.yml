note: >-
  Every RFC-defined /.well-known/ discovery document returns 404 on the McGrath
  web property. There is no API host to probe: apis.yml carries no apis[] entries
  and the api., apis., developer., developers., docs., feeds., data. and portal.
  subdomains of mcgrath.com.au do not resolve (NXDOMAIN, recorded in review.yml).
  The only machine-readable surfaces McGrath publishes are robots.txt and the
  twelve XML sitemaps it advertises — both captured here.
probe_note: >-
  www.mcgrath.com.au sits behind a Vercel Security Checkpoint that answers plain
  HTTP clients (curl, scripted fetchers) with HTTP 429 and an HTML challenge page
  for EVERY path, including /robots.txt and the site root. Statuses below were
  therefore established with a browser-equivalent rendering fetch, which receives
  the real origin status. This challenge is itself an agent-readiness fact: no
  unattended client can read anything on this domain, machine-readable or not.
