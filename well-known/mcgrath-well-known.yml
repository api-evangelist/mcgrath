  - /$rpc/google.internal.maps.mapsjs.v1.MapsJsInternalService/
  - /%24rpc/google.internal.maps.mapsjs.v1.MapsJsInternalService/
  reading: >-
    Read strictly under RFC 9309 group-matching rules — a crawler obeys only the
    most specific group that names it, and ignores User-agent: * once its own
    group exists — the named AI crawlers are NOT blocked from /properties/ or
    /search/. Their groups disallow only Google Maps JS/RPC paths, which is
    boilerplate carried over from Google's own Maps robots directives and has
    nothing to do with listing inventory. The /properties/ and /search/ block
    lands solely on User-agent: *, i.e. on generic and unnamed crawlers. The
    practical effect is the inverse of the intent one would assume from seeing
    twenty AI user-agents enumerated: the listing corpus is crawlable by the
    named AI agents and closed to everyone else, while the twelve sitemaps
    (including properties-buy / properties-sold / properties-rent /
    properties-leased) advertise those same listing URLs to any client. This
    corrects the earlier round's reading, which treated the AI-agent groups as
    inheriting the /properties/ and /search/ disallows.
  caveat: >-
    Crawlability under robots.txt is not the same as reachability. The Vercel
    Security Checkpoint above 429s scripted clients regardless of robots.txt, so
    an AI agent that respects robots.txt still cannot fetch a listing page
    without executing the browser challenge.
