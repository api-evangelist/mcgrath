aid: mcgrath
name: McGrath
review:
  question: >-
    Does McGrath publish a public, machine-readable API surface for its Australian
    residential real estate listings, property management, or transaction data — and
    what is its RESO posture?
  answer: false
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: brokerage
  primaryDomain: mcgrath.com.au

sectorPosture:
  resoPosture:
    certified: false
    summary: >-
      No RESO presence of any kind. RESO (Real Estate Standards Organization) is a
      North American body whose Web API and Data Dictionary certifications are driven
      by NAR policy and enforced through MLS membership. Australia has no MLS system
      and no RESO equivalent — the market is instead a portal duopoly (REA Group's
      realestate.com.au and Domain) sitting over state land registries, with PEXA as
      the electronic conveyancing rail. McGrath appears nowhere in the RESO
      certification directory, publishes no OData service root or $metadata document,
      and makes no reference to the RESO Universal Property Identifier (UPI).
    webApiCertification: none
    dataDictionaryCertification: none
    dataDictionaryVersion: null
    directoryEvidence: >-
      RESO certification directory (https://certification.reso.org/ and
      https://www.reso.org/certificates/) was consulted; certification.reso.org
      returned no renderable content to an anonymous fetch (dynamic app shell), and
      targeted search of the RESO certified-organization listings surfaced no McGrath
      entry and no Australian organizations. RESO's own certification program is
      scoped to MLSs, brokerages and vendors operating under NAR/MLS rules, which
      structurally excludes an Australian brokerage.
    odataEndpoints: none
    metadataDocument: none
    universalPropertyIdentifier: not referenced
    honestStatement: >-
      Not certified and not applicable — RESO is absent from the Australian market,
      so the honest answer here is absence rather than "certified but unreachable".
  accessGate:
    classification: none-published
    whatADeveloperMustSignOrJoin: >-
      Nothing, because there is nothing to sign up for. McGrath publishes no
      developer agreement, no data licence, no IDX/VOW-equivalent, no partner
      programme and no API terms. There is no application form, no member portal
      login for developers, and no sponsored-broker path. A third party wanting
      McGrath listing data in machine-readable form must go around McGrath entirely
      — to the portals McGrath syndicates into (REA Group / Domain, both commercial
      partner-only APIs), to CoreLogic or PropTrack for valuation and property
      records, or to PEXA for transaction/settlement rails (PEXA gates its developer
      portal behind a signed PEXA API Agreement, credentials issued by
      apisupport@pexa.com.au, authenticated with OAuth 2.0 or mutual TLS).
    gated: true
    gatedRationale: >-
      Nothing McGrath operates is publicly callable. The classification is
      none-published rather than licence-agreement or partner-only because McGrath
      does not publish any access path at all — not even a closed one.
  openData:
    exists: false
    summary: >-
      McGrath publishes no open dataset. Australia's open-data counterweight lives
      with government, not with brokerages — state land registries (several
      progressively privatised), data.gov.au, and PEXA's near-mandated settlement
      network are the machine-readable rails in this market, and none of them are
      McGrath's to publish. McGrath's robots.txt works against openness, though not
      in the way its shape first suggests: the /properties/ and /search/ disallows
      sit only under User-agent: *, while the twenty named groups — GPTBot,
      ChatGPT-User, OAI-SearchBot, ClaudeBot, PerplexityBot, Google-Extended, CCBot,
      Bytespider, AhrefsBot, Applebot, AdsBot-Google and others — disallow nothing
      but Google Maps JS/RPC paths. Under RFC 9309 a crawler obeys only its own most
      specific group, so the named AI agents are nominally free to crawl the listing
      corpus that generic crawlers are blocked from, and the twelve sitemaps
      advertise those listing URLs to anyone. The effective gate is not robots.txt
      at all but the Vercel Security Checkpoint fronting www.mcgrath.com.au, which
      answers scripted clients with HTTP 429 and a browser challenge on every path.
      Corrected 2026-07-26 in the second enrichment round; see
      well-known/mcgrath-well-known.yml for the captured file and the full reading.
  authModel:
    scheme: none published
    detail: >-
      No API key issuance, no OAuth 2.0 authorization server, no OpenID Connect
      discovery document, and no SAML member-portal metadata was found on
      mcgrath.com.au. https://www.mcgrath.com.au/.well-known/openid-configuration
      returned HTTP 404 to an anonymous request. Agent and office logins on the site
      are consumer/staff web sessions with no documented machine interface.
  webhooksEventsSdksPostman:
    webhooks: none found
    events: none found
    sdks: none found
    postman: none found
    githubOrganization: >-
      None. GitHub organization search for "McGrath Estate Agents" returned
      total_count 0. No public source, SDK, or spec repository exists.
    note: >-
      The absence is itself the finding: this is a brokerage that buys technology
      (CRM, portal syndication, conveyancing) rather than one that ships a platform.
  productApiFamily:
    note: >-
      McGrath's real product segmentation, taken from its own site, is residential
      sales, property management/rentals, projects (new development marketing),
      rural and livestock, Asia Desk, home loans via Oxygen Home Loans, and
      insurance partnerships. None of these segments is expressed as an API. Listing
      distribution runs outbound into realestate.com.au and Domain; there is no
      documented inbound or outbound machine contract published by McGrath.

findings:
  summary: |
    McGrath has no public API surface. Every candidate developer host and path was
    probed and every one either failed to resolve or returned 404. The company is a
    consumer of Australia's property rails (REA/Domain portals, PEXA conveyancing,
    PropTrack/CoreLogic valuation), not a producer of them. RESO does not apply here
    at all — it is a NAR/MLS-driven North American regime with no Australian analogue
    — so the correct RESO posture is absence, not "certified but closed". apis[] in
    apis.yml is deliberately empty and no openapi/ directory was created because no
    real artifact was found. Recorded as built-stub: identity captured, API surface
    genuinely nil.
  probes:
