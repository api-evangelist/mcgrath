      - host: developer.mcgrath.com.au
        result: NXDOMAIN (no A record)
      - host: developers.mcgrath.com.au
        result: NXDOMAIN (no A record)
      - host: api.mcgrath.com.au
        result: NXDOMAIN (no A record)
      - host: docs.mcgrath.com.au
        result: NXDOMAIN (no A record)
      - host: feeds.mcgrath.com.au
        result: NXDOMAIN (no A record)
      - host: data.mcgrath.com.au
        result: NXDOMAIN (no A record)
