  marketContext: |
    Australia's machine-readable property surface is concentrated away from
    brokerages. Listings distribution is a duopoly of REA Group's
    realestate.com.au and Domain (developer.domain.com.au), both commercial
    partner-gated. Valuation and property records concentrate in PropTrack
    (REA-owned) and CoreLogic. PEXA is the electronic conveyancing network that
    settles the large majority of Australian property transactions and is
    effectively mandated in most states — the closest thing in this study to a
    required national machine-readable property rail — and it gates its developer
    portal behind a signed PEXA API Agreement with OAuth 2.0 or mutual TLS
    authentication. A brokerage like McGrath is a customer of all three layers.
  corporateFacts:
    founded: 1988 (as McGrath Goodhope Realty; McGrath Partners 1991; McGrath 2000)
    founder: John McGrath
    headquarters: Pyrmont, Sydney, New South Wales, Australia
    network: approximately 118 offices across NSW, QLD, ACT, VIC and TAS (mixed company-owned and franchise)
    listedASX: 2015 as McGrath Limited (ASX:MEA)
    acquired: >-
      June 2024 by a Knight Frank Australia and Bayleys (New Zealand) consortium for
      A$95.5m (60c/share); scheme effective 17 June 2024, implemented 27 June 2024,
      delisted from the ASX 28 June 2024.
    businessLines:
      - Residential sales
      - Property management and rentals
      - Projects / new development marketing
      - Rural and livestock
      - Asia Desk (offshore buyers)
      - Home loans (Oxygen Home Loans)
      - Insurance partnerships

